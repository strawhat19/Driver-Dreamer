<svg id="driver-dreamer-apex-icon" class="driver-dreamer-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="driver-apex-title driver-apex-desc">
  <title id="driver-apex-title">Driver Dreamer — Apex Double D</title>
  <desc id="driver-apex-desc">Two forward-leaning D forms pair deep navy and racing red. Their broad curved contours suggest parallel circuit lanes, while the open centers keep the monogram clear at app-icon size.</desc>
  <g id="driver-apex-monogram" class="driver-apex-monogram" transform="matrix(1 0 -.105 1 13.44 0)">
    <path id="driver-apex-navy-d" class="driver-apex-letter" fill="#07162F" fill-rule="evenodd" d="M24 60H67C104 60 125 86 125 128S104 196 67 196H24ZM48 84V172H66C88 172 101 156 101 128S88 84 66 84Z"/>
    <path id="driver-apex-red-d" class="driver-apex-letter" fill="#E32636" fill-rule="evenodd" d="M131 60H174C211 60 232 86 232 128S211 196 174 196H131ZM155 84V172H173C195 172 208 156 208 128S195 84 173 84Z"/>
    <path id="driver-apex-navy-apex" class="driver-apex-track-apex" d="M36 144V168" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path id="driver-apex-red-apex" class="driver-apex-track-apex" d="M143 88V112" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
