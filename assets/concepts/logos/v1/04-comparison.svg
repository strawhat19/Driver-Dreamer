<svg id="driver-dreamer-v1-comparison" class="driver-dreamer-comparison" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1150" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">Driver Dreamer — first logo concepts</title>
  <desc id="board-desc">Three original logo directions for a luxury sports and exotic vehicle app and database. Each uses red, deep navy and white, with a light presentation and a smaller inverse mark on navy.</desc>
  <rect width="1800" height="1150" fill="#F1F3F6"/>
  <text x="64" y="79" font-family="Avenir Next, Arial, sans-serif" font-size="43" font-weight="750" fill="#07162F">Driver Dreamer / V1</text>
  <text x="66" y="122" font-family="Avenir Next, Arial, sans-serif" font-size="22" fill="#526077">Luxury, sports and exotic vehicles · Logo concept exploration</text>
  <rect x="64" y="171" width="540" height="859" rx="24" fill="#FFFFFF"/>
  <text x="96" y="220" font-family="Avenir Next, Arial, sans-serif" font-size="16" font-weight="750" letter-spacing="2" fill="#E32636">01</text>
  <text x="96" y="258" font-family="Avenir Next, Arial, sans-serif" font-size="27" font-weight="700" fill="#07162F">Apex Double D</text>
<svg x="152" y="288" width="364" height="364" id="board-0-driver-dreamer-apex-icon" class="driver-dreamer-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="board-0-driver-apex-title board-0-driver-apex-desc">
  <title id="board-0-driver-apex-title">Driver Dreamer — Apex Double D</title>
  <desc id="board-0-driver-apex-desc">Two forward-leaning D forms pair deep navy and racing red. Their broad curved contours suggest parallel circuit lanes, while the open centers keep the monogram clear at app-icon size.</desc>
  <g id="board-0-driver-apex-monogram" class="driver-apex-monogram" transform="matrix(1 0 -.105 1 13.44 0)">
    <path id="board-0-driver-apex-navy-d" class="driver-apex-letter" fill="#07162F" fill-rule="evenodd" d="M24 60H67C104 60 125 86 125 128S104 196 67 196H24ZM48 84V172H66C88 172 101 156 101 128S88 84 66 84Z"/>
    <path id="board-0-driver-apex-red-d" class="driver-apex-letter" fill="#E32636" fill-rule="evenodd" d="M131 60H174C211 60 232 86 232 128S211 196 174 196H131ZM155 84V172H173C195 172 208 156 208 128S195 84 173 84Z"/>
    <path id="board-0-driver-apex-navy-apex" class="driver-apex-track-apex" d="M36 144V168" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path id="board-0-driver-apex-red-apex" class="driver-apex-track-apex" d="M143 88V112" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

