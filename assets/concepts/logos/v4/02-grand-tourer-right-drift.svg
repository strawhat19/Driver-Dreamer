<svg id="driver-dreamer-02-grand-tourer-right-drift-lockup" class="driver-dreamer-logo-lockup" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 256" role="img" aria-labelledby="lockup-title lockup-desc">
  <title id="lockup-title">Driver Dreamer — Grand Tourer — Right Drift</title>
  <desc id="lockup-desc">The original Grand Tourer Crest retains its navy shield, red crown, white sports car and Driver Dreamer wordmark. Three filled red circular thought bubbles replace only the original collection rows, drifting subtly to the right as they descend beneath the vehicle.</desc>
