  <desc id="lockup-driver-dreamer-left-drift-lockup-desc">The original Grand Tourer navy shield, red crown, white sports car and Driver Dreamer wordmark are preserved. Three filled red thought bubbles grow toward the car, with a subtle leftward drift toward the bottom.</desc>
