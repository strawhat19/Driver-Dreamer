  <path id="precision-wheel-spokes" d="M62 104C84 103 102 111 120 120C138 111 155 103 170 104M120 120V170" fill="none" stroke="#07162F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="precision-wheel-hub" cx="120" cy="120" r="17" fill="#E32636"/>
  <g id="precision-index-tabs" fill="#E32636">
    <rect id="precision-index-top" x="172" y="91" width="43" height="12" rx="6"/>
