<title id="02-panorama-gt-title">Driver Dreamer — Panorama GT</title>
<desc id="02-panorama-gt-desc">An original navy grand-touring car side profile sits beneath an open red horizon arc. Two wheel hubs and simple window openings remain legible at icon size; the body does not represent a specific manufacturer or model.</desc>
