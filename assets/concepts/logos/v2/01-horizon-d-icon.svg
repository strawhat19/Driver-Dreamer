<title id="01-horizon-d-icon-title">Driver Dreamer — Horizon D icon</title>
<desc id="01-horizon-d-icon-desc">A deep navy capital D is split by a rising racing-red road with a white lane. The single-letter silhouette expresses driving aspiration without repeating the paired racetrack initials from v1.</desc>
