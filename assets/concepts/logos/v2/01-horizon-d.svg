<title id="01-horizon-d-title">Driver Dreamer — Horizon D</title>
<desc id="01-horizon-d-desc">A deep navy capital D is split by a rising racing-red road with a white lane. The single-letter silhouette expresses driving aspiration without repeating the paired racetrack initials from v1.</desc>
