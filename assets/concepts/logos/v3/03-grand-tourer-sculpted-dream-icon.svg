    <desc id="sculpted-dream-icon-description" class="driver-dreamer-logo-description">The original softened navy Grand Tourer Crest is refined with a slim red crown and a lower, wider white grand tourer. Split headlights and a tapered intake sharpen the original generic vehicle silhouette. Three red thought bubbles grow diagonally upward toward the dream car.</desc>
