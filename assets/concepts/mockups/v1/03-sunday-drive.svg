            <circle id="sunday-drive-feature-discover-lens" class="sunday-drive-feature-discover-lens" cx="549" cy="978" r="8" fill="none" stroke="#E32636" stroke-width="1.8" />
            <path id="sunday-drive-feature-discover-handle" class="sunday-drive-feature-discover-handle" d="M555 984L562 991" fill="none" stroke="#E32636" stroke-width="1.8" stroke-linecap="round" />
            <text id="sunday-drive-feature-discover-title" class="sunday-drive-feature-discover-title" x="580" y="986" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="21">Discover</text>
            <text id="sunday-drive-feature-discover-copy" class="sunday-drive-feature-discover-copy" x="540" y="1023" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">
                <tspan id="sunday-drive-feature-discover-line-1" class="sunday-drive-feature-discover-line-1" x="540" y="1023" font-family="Gill Sans" font-weight="400">From timeless icons to future</tspan>
                <tspan id="sunday-drive-feature-discover-line-2" class="sunday-drive-feature-discover-line-2" x="540" y="1047" font-family="Gill Sans" font-weight="400">classics. Find your favorites.</tspan>
            </text>
        </g>
        <path id="sunday-drive-feature-divider-1" class="sunday-drive-feature-divider-1" d="M809 969V1077" fill="none" stroke="#DCE2EA" stroke-width="1" />
        <g id="sunday-drive-feature-save" class="sunday-drive-feature-save">
            <path id="sunday-drive-feature-save-heart" class="sunday-drive-feature-save-heart" d="M847 990L839 982C831 974 842 967 847 976C852 967 863 974 855 982Z" fill="none" stroke="#E32636" stroke-width="1.8" stroke-linejoin="round" />
            <text id="sunday-drive-feature-save-title" class="sunday-drive-feature-save-title" x="877" y="986" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="21">Save</text>
            <text id="sunday-drive-feature-save-copy" class="sunday-drive-feature-save-copy" x="838" y="1023" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">
                <tspan id="sunday-drive-feature-save-line-1" class="sunday-drive-feature-save-line-1" x="838" y="1023" font-family="Gill Sans" font-weight="400">Keep the cars that catch your</tspan>
                <tspan id="sunday-drive-feature-save-line-2" class="sunday-drive-feature-save-line-2" x="838" y="1047" font-family="Gill Sans" font-weight="400">eye in a collection of your own.</tspan>
            </text>
        </g>
        <path id="sunday-drive-feature-divider-2" class="sunday-drive-feature-divider-2" d="M1105 969V1077" fill="none" stroke="#DCE2EA" stroke-width="1" />
        <g id="sunday-drive-feature-compare" class="sunday-drive-feature-compare">
            <path id="sunday-drive-feature-compare-arrows" class="sunday-drive-feature-compare-arrows" d="M1137 975H1159M1153 969L1159 975L1153 981M1159 988H1137M1143 982L1137 988L1143 994" fill="none" stroke="#E32636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <text id="sunday-drive-feature-compare-title" class="sunday-drive-feature-compare-title" x="1176" y="986" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="21">Compare</text>
            <text id="sunday-drive-feature-compare-copy" class="sunday-drive-feature-compare-copy" x="1137" y="1023" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">
                <tspan id="sunday-drive-feature-compare-line-1" class="sunday-drive-feature-compare-line-1" x="1137" y="1023" font-family="Gill Sans" font-weight="400">Bring your dream cars together.</tspan>
                <tspan id="sunday-drive-feature-compare-line-2" class="sunday-drive-feature-compare-line-2" x="1137" y="1047" font-family="Gill Sans" font-weight="400">Find what makes each special.</tspan>
            </text>
        </g>
    </g>
    <g id="sunday-drive-footer" class="sunday-drive-footer">
        <a id="sunday-drive-footer-home-link" class="sunday-drive-footer-home-link" href="/">
            <image id="sunday-drive-footer-logo" class="sunday-drive-footer-logo" href="media/logo.png" x="64" y="1136" width="231" height="64" preserveAspectRatio="xMidYMid meet" />
        </a>
        <g id="sunday-drive-footer-menu" class="sunday-drive-footer-menu">
            <a id="sunday-drive-footer-about-link" class="sunday-drive-footer-about-link" href="/about"><text id="sunday-drive-footer-about-text" class="sunday-drive-footer-about-text" x="961" y="1171" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="15">About</text></a>
            <a id="sunday-drive-footer-terms-link" class="sunday-drive-footer-terms-link" href="/terms"><text id="sunday-drive-footer-terms-text" class="sunday-drive-footer-terms-text" x="1054" y="1171" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="15">Terms</text></a>
            <a id="sunday-drive-footer-contact-link" class="sunday-drive-footer-contact-link" href="/contact"><text id="sunday-drive-footer-contact-text" class="sunday-drive-footer-contact-text" x="1146" y="1171" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="15">Contact</text></a>
            <a id="sunday-drive-footer-privacy-link" class="sunday-drive-footer-privacy-link" href="/privacy"><text id="sunday-drive-footer-privacy-text" class="sunday-drive-footer-privacy-text" x="1261" y="1171" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="15">Privacy</text></a>
        </g>
        <path id="sunday-drive-footer-divider" class="sunday-drive-footer-divider" d="M56 1216H1384" stroke="#E7EBF0" stroke-width="1" />
        <text id="sunday-drive-footer-copyright" class="sunday-drive-footer-copyright" x="64" y="1251" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="13">© 2026 Driver Dreamer. Built by <a id="sunday-drive-footer-piratechs-link" class="sunday-drive-footer-piratechs-link" href="https://piratechs.com/"><tspan id="sunday-drive-footer-piratechs-text" class="sunday-drive-footer-piratechs-text" fill="#E32636" font-family="Gill Sans" font-weight="600">Piratechs.</tspan></a></text>
        <text id="sunday-drive-footer-tagline" class="sunday-drive-footer-tagline" x="1376" y="1251" text-anchor="end" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="13">Every great drive begins with a little dreaming.</text>
    </g>
</svg>
