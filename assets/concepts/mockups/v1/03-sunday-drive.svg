            <tspan id="sunday-drive-garage-title-line-2" class="sunday-drive-garage-title-line-2" x="64" y="1021" font-family="Gill Sans" font-weight="600">your next favorite.</tspan>
        </text>
        <text id="sunday-drive-garage-section-description" class="sunday-drive-garage-section-description" x="64" y="1062" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">A garage built around your curiosity.</text>
