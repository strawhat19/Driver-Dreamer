<svg
    width="1440"
    height="1280"
    id="driver-dreamer-sunday-drive-page"
    class="driver-dreamer-sunday-drive-page"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1440 1280"
    role="img"
    aria-labelledby="sunday-drive-title sunday-drive-description"
>
    <title id="sunday-drive-title" class="sunday-drive-title">Driver Dreamer — Sunday Drive website concept</title>
    <desc id="sunday-drive-description" class="sunday-drive-description">An editorial automotive landing page with the official logo, Gill Sans typography, a panoramic red Ferrari 458 Italia hero, one dream-garage feature section and a complete footer.</desc>
    <defs id="sunday-drive-definitions" class="sunday-drive-definitions">
        <clipPath id="sunday-drive-hero-photo-clip" class="sunday-drive-hero-photo-clip">
            <rect id="sunday-drive-hero-photo-clip-shape" class="sunday-drive-hero-photo-clip-shape" x="56" y="331" width="1328" height="505" rx="16" />
        </clipPath>
    </defs>
    <rect id="sunday-drive-canvas" class="sunday-drive-canvas" width="1440" height="1280" fill="#FFFFFF" />
    <g id="sunday-drive-header" class="sunday-drive-header">
        <a id="sunday-drive-header-home-link" class="sunday-drive-header-home-link" href="/">
            <image id="sunday-drive-header-official-logo" class="sunday-drive-header-official-logo" href="media/logo.png" x="64" y="16" width="270" height="75" preserveAspectRatio="xMidYMid meet" />
        </a>
        <g id="sunday-drive-header-menu" class="sunday-drive-header-menu">
            <a id="sunday-drive-menu-discover-link" class="sunday-drive-menu-discover-link" href="/discover">
                <text id="sunday-drive-menu-discover-text" class="sunday-drive-menu-discover-text" x="610" y="60" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="16">Discover</text>
                <path id="sunday-drive-menu-discover-active-line" class="sunday-drive-menu-discover-active-line" d="M610 73H674" stroke="#E32636" stroke-width="2" />
            </a>
            <a id="sunday-drive-menu-collections-link" class="sunday-drive-menu-collections-link" href="/collections">
                <text id="sunday-drive-menu-collections-text" class="sunday-drive-menu-collections-text" x="722" y="60" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">Collections</text>
            </a>
            <a id="sunday-drive-menu-journal-link" class="sunday-drive-menu-journal-link" href="/journal">
                <text id="sunday-drive-menu-journal-text" class="sunday-drive-menu-journal-text" x="862" y="60" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">Journal</text>
            </a>
            <a id="sunday-drive-menu-about-link" class="sunday-drive-menu-about-link" href="/about">
                <text id="sunday-drive-menu-about-text" class="sunday-drive-menu-about-text" x="968" y="60" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">About</text>
            </a>
        </g>
        <a id="sunday-drive-header-garage-link" class="sunday-drive-header-garage-link" href="/garage">
            <rect id="sunday-drive-header-garage-button" class="sunday-drive-header-garage-button" x="1204" y="29" width="172" height="46" rx="7" fill="#FFFFFF" stroke="#07162F" stroke-width="1.2" />
            <path id="sunday-drive-header-garage-icon" class="sunday-drive-header-garage-icon" d="M1224 49L1234 43L1244 49V64H1224ZM1228 52H1240M1228 57H1240M1228 62H1240" fill="none" stroke="#07162F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <text id="sunday-drive-header-garage-text" class="sunday-drive-header-garage-text" x="1257" y="59" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="16">My Garage</text>
        </a>
        <path id="sunday-drive-header-divider" class="sunday-drive-header-divider" d="M56 104H1384" stroke="#E7EBF0" stroke-width="1" />
    </g>
    <g id="sunday-drive-hero" class="sunday-drive-hero">
        <text id="sunday-drive-hero-eyebrow" class="sunday-drive-hero-eyebrow" x="720" y="139" text-anchor="middle" fill="#E32636" font-family="Gill Sans" font-weight="600" font-size="12" letter-spacing="2.2">FOR THE LOVE OF THE DRIVE</text>
        <text id="sunday-drive-hero-heading" class="sunday-drive-hero-heading" x="720" y="201" text-anchor="middle" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="60" letter-spacing="-1.6">Some cars stay with you.</text>
        <text id="sunday-drive-hero-description" class="sunday-drive-hero-description" x="720" y="235" text-anchor="middle" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="19">Discover the cars you love. Build the garage you dream about.</text>
        <a id="sunday-drive-hero-explore-link" class="sunday-drive-hero-explore-link" href="/discover">
            <rect id="sunday-drive-hero-explore-button" class="sunday-drive-hero-explore-button" x="525" y="261" width="189" height="48" rx="7" fill="#E32636" />
            <path id="sunday-drive-hero-explore-icon" class="sunday-drive-hero-explore-icon" d="M546 289H566V283L562 278H550L547 283V289ZM550 283H562M550 289V293M562 289V293" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            <text id="sunday-drive-hero-explore-text" class="sunday-drive-hero-explore-text" x="580" y="291" fill="#FFFFFF" font-family="Gill Sans" font-weight="600" font-size="16">Explore cars</text>
            <path id="sunday-drive-hero-explore-arrow" class="sunday-drive-hero-explore-arrow" d="M681 285H695M689 279L695 285L689 291" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </a>
        <a id="sunday-drive-hero-garage-link" class="sunday-drive-hero-garage-link" href="/garage">
            <rect id="sunday-drive-hero-garage-button" class="sunday-drive-hero-garage-button" x="730" y="261" width="185" height="48" rx="7" fill="#FFFFFF" stroke="#07162F" stroke-width="1.2" />
            <path id="sunday-drive-hero-garage-heart" class="sunday-drive-hero-garage-heart" d="M758 293L749 284C741 276 752 270 758 279C764 270 775 276 767 284Z" fill="none" stroke="#07162F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <text id="sunday-drive-hero-garage-text" class="sunday-drive-hero-garage-text" x="781" y="291" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="16">Start your garage</text>
        </a>
        <image id="sunday-drive-hero-ferrari-photo" class="sunday-drive-hero-ferrari-photo" href="media/hero-ferrari-458.png" x="56" y="331" width="1328" height="505" preserveAspectRatio="xMidYMid slice" clip-path="url(#sunday-drive-hero-photo-clip)" />
        <rect id="sunday-drive-hero-featured-chip" class="sunday-drive-hero-featured-chip" x="80" y="764" width="192" height="44" rx="7" fill="#FFFFFF" />
        <circle id="sunday-drive-hero-featured-chip-dot" class="sunday-drive-hero-featured-chip-dot" cx="99" cy="786" r="3.5" fill="#E32636" />
        <text id="sunday-drive-hero-featured-chip-text" class="sunday-drive-hero-featured-chip-text" x="113" y="791" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="12" letter-spacing="1">IN THE DREAM GARAGE</text>
        <g id="sunday-drive-hero-vehicle-caption" class="sunday-drive-hero-vehicle-caption">
            <text id="sunday-drive-hero-vehicle-name" class="sunday-drive-hero-vehicle-name" x="64" y="875" fill="#07162F" font-family="Gill Sans" font-weight="600" font-size="25">Ferrari 458 Italia</text>
            <text id="sunday-drive-hero-vehicle-details" class="sunday-drive-hero-vehicle-details" x="307" y="875" fill="#07162F" font-family="Gill Sans" font-weight="400" font-size="16">Red exterior · Cream tan interior · Polished silver wheels</text>
            <a id="sunday-drive-hero-view-car-link" class="sunday-drive-hero-view-car-link" href="/cars/ferrari-458-italia">
                <text id="sunday-drive-hero-view-car-text" class="sunday-drive-hero-view-car-text" x="1223" y="875" fill="#E32636" font-family="Gill Sans" font-weight="600" font-size="16">Meet the car</text>
                <path id="sunday-drive-hero-view-car-arrow" class="sunday-drive-hero-view-car-arrow" d="M1339 869H1357M1350 862L1357 869L1350 876" fill="none" stroke="#E32636" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </a>
            <path id="sunday-drive-hero-caption-divider" class="sunday-drive-hero-caption-divider" d="M56 907H1384" stroke="#E7EBF0" stroke-width="1" />
        </g>
    </g>
    <g id="sunday-drive-garage-section" class="sunday-drive-garage-section">
